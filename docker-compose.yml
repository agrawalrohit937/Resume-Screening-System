version: "3.8"

# ═══════════════════════════════════════════════════════════════════════════════
# CareerShala — Local Development Services (PostgreSQL)
# Run `docker compose up -d` to spin up PostgreSQL with zero local configuration.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: careershala_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careershala_db
    volumes:
      - careershala_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careershala_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  careershala_pg_data:
