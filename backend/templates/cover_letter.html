<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cover Letter - {{ company_name }}</title>
    <style>
        @page {
            size: letter;
            margin: 1in;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #1e293b;
            line-height: 1.6;
            font-size: 11pt;
        }
        .header {
            border-bottom: 2px solid #2E9BDA;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .company-title {
            font-size: 14pt;
            font-weight: bold;
            color: #1d6fa5;
        }
        .content {
            white-space: pre-wrap;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 9pt;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="company-title">Application for {{ company_name }}</div>
    </div>
    
    <div class="content">
{{ body }}
    </div>

    <div class="footer">
        Generated via CareerShala AI Co-Pilot
    </div>
</body>
</html>
