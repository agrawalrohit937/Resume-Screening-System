<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Main Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <!-- Face Plate Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" opacity="0.4" />
      <stop offset="100%" stop-color="#1E1B4B" opacity="0.8" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadow for 3D Effect -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#312E81" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left & Right Ears -->
  <circle cx="28" cy="65" r="10" fill="#3B82F6" />
  <circle cx="92" cy="65" r="10" fill="#4F46E5" />

  <!-- Top Antenna Line -->
  <line x1="60" y1="42" x2="60" y2="22" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" />
  <!-- Top Antenna Ball -->
  <circle cx="60" cy="18" r="7" fill="#60A5FA" />

  <!-- Main Head / Body (With Shadow) -->
  <rect x="32" y="40" width="56" height="48" rx="24" fill="url(#bodyGrad)" filter="url(#dropShadow)" />

  <!-- Inner Face Plate -->
  <rect x="40" y="52" width="40" height="26" rx="13" fill="url(#faceGrad)" />

  <!-- Smiling Eyes (^ ^) -->
  <path d="M 46 64 Q 50 58 54 64" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M 66 64 Q 70 58 74 64" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Big Sparkle (Top Right) -->
  <path d="M 98 25 Q 98 38 85 38 Q 98 38 98 51 Q 98 38 111 38 Q 98 38 98 25" fill="url(#sparkleGrad)" />
  
  <!-- Small Sparkle -->
  <path d="M 82 15 Q 82 22 75 22 Q 82 22 82 29 Q 82 22 89 22 Q 82 22 82 15" fill="#93C5FD" />
</svg>
